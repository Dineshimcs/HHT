{% extends 'base/base.html' %}

{% block title %}Sign In - {{ PLATFORM_NAME }}{% endblock %}

{% block content %}
<div class="mobile-app-shell">

  <div style="padding: 2rem 1.25rem 1rem; text-align: center; background: linear-gradient(135deg, var(--color-surface) 0%, var(--color-brand-blue-subtle) 100%); border-bottom: 1px solid var(--color-border);">
    <div data-aura-logo="icon" data-width="56" data-height="56" style="margin: 0 auto 0.85rem;"></div>
    <h2 style="font-weight: 800; font-size: 1.4rem; color: var(--color-text-primary);">Welcome Back</h2>
    <p style="font-size: 0.82rem; color: var(--color-text-muted);">Sign in to your HariHara Travels mobile account</p>
  </div>

  <div style="padding: 1.25rem 1.25rem 2rem;">

    <!-- Quick Demo Logins Bar -->
    <div style="margin-bottom: 1.25rem; padding: 0.85rem; background: var(--color-surface); border-radius: var(--radius-mobile-card); border: 1px solid var(--color-border); box-shadow: var(--shadow-sm);">
      <div style="font-size: 0.72rem; font-weight: 700; color: var(--color-brand-blue); text-transform: uppercase; margin-bottom: 0.5rem; text-align: center;">⚡ Instant Demo Login</div>
      <div class="flex gap-2">
        <button type="button" class="btn btn-secondary btn-sm mobile-touch-active" style="flex: 1; font-size: 0.75rem; border-radius: var(--radius-full);" onclick="quickLogin('customer@aura.com', 'pass123')">🧑 Customer</button>
        <button type="button" class="btn btn-secondary btn-sm mobile-touch-active" style="flex: 1; font-size: 0.75rem; border-radius: var(--radius-full);" onclick="quickLogin('driver@aura.com', 'pass123')">👨‍✈️ Driver</button>
        <button type="button" class="btn btn-secondary btn-sm mobile-touch-active" style="flex: 1; font-size: 0.75rem; border-radius: var(--radius-full);" onclick="quickLogin('admin@aura.com', 'pass123')">🛡️ Admin</button>
      </div>
    </div>

    <form method="POST" action="{% url 'accounts:login' %}" id="login-form">
      {% csrf_token %}
      
      <div class="form-group" style="margin-bottom: 1rem;">
        <label class="form-label" style="font-size: 0.8rem;">Username or Email</label>
        <input type="text" name="username" id="username_input" class="form-input" style="padding: 0.75rem 1rem; border-radius: var(--radius-md);" required placeholder="Enter username or email">
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label class="form-label" style="font-size: 0.8rem;">Password</label>
        <input type="password" name="password" id="password_input" class="form-input" style="padding: 0.75rem 1rem; border-radius: var(--radius-md);" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary mobile-touch-active" style="width: 100%; border-radius: var(--radius-full); padding: 0.85rem; font-size: 0.95rem; font-weight: 700;">
        Sign In →
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--color-text-muted);">
      Don't have an account? <a href="{% url 'accounts:register_customer' %}" style="font-weight: 700; color: var(--color-brand-blue);">Sign Up</a>
    </div>

  </div>
</div>

<script>
  function quickLogin(username, password) {
    document.getElementById('username_input').value = username;
    document.getElementById('password_input').value = password;
    document.getElementById('login-form').submit();
  }
</script>
{% endblock %}

<header class="mobile-app-header-container" style="background-color: var(--color-surface); border-bottom: 1px solid var(--color-border); position: sticky; top: 0; z-index: 800; box-shadow: var(--shadow-xs);">
  <div class="container flex items-center justify-between" style="height: 64px;">
    
    <!-- Brand Logo & Mobile Native App Identity -->
    <a href="{% url 'landing' %}" class="flex items-center gap-2" style="text-decoration: none;">
      <div data-aura-logo="full" data-width="160" data-height="40"></div>
    </a>

    <!-- Nav Links (Desktop) & Quick Mobile Controls -->
    <nav class="flex items-center gap-3">
      <div class="desktop-nav-links flex items-center gap-5">
        <a href="{% url 'landing' %}" style="font-weight: 600; color: var(--color-text-primary); font-size: 0.9rem;">Home</a>
        <a href="{% url 'bookings:create' %}" style="font-weight: 600; color: var(--color-text-primary); font-size: 0.9rem;">Book Ride</a>
        <a href="{% url 'drivers:dashboard' %}" style="font-weight: 600; color: var(--color-text-primary); font-size: 0.9rem;">Driver Portal</a>
        <a href="{% url 'admin_ops:dashboard' %}" style="font-weight: 600; color: var(--color-text-primary); font-size: 0.9rem;">Ops</a>
      </div>

      <!-- Theme Switcher Pill -->
      <button data-theme-toggle class="mobile-touch-active btn btn-secondary btn-sm" title="Toggle Theme" style="border-radius: var(--radius-full); width: 38px; height: 38px; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 1.1rem;">
        🌙
      </button>

      {% if user.is_authenticated %}
        <a href="{% url 'customers:dashboard' %}" class="mobile-touch-active flex items-center gap-2" style="text-decoration: none; padding: 0.35rem 0.75rem; background: var(--color-surface-hover); border-radius: var(--radius-full); border: 1px solid var(--color-border);">
          <div style="width: 26px; height: 26px; border-radius: 50%; background: var(--color-brand-blue); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;">
            {{ user.username|slice:":1"|upper }}
          </div>
          <span class="user-greeting-name" style="font-size: 0.82rem; font-weight: 600; color: var(--color-text-primary);">{{ user.first_name|default:user.username }}</span>
        </a>
        <a href="{% url 'accounts:logout' %}" class="desktop-only btn btn-secondary btn-sm" style="border-radius: var(--radius-full);">Logout</a>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="btn btn-secondary btn-sm" style="border-radius: var(--radius-full);">Login</a>
        <a href="{% url 'accounts:register_customer' %}" class="btn btn-primary btn-sm" style="border-radius: var(--radius-full);">Sign Up</a>
      {% endif %}
    </nav>
  </div>
</header>

<style>
  @media (max-width: 768px) {
    .desktop-nav-links, .desktop-only, .user-greeting-name {
      display: none !important;
    }
  }
</style>

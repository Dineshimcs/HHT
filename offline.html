<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Offline Mode | HariHara Travels</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body class="aura-vector-bg flex items-center justify-center" style="min-height: 100vh; text-align: center; padding: 2rem;">
  <div class="card" style="max-width: 520px; padding: 3rem 2rem; box-shadow: var(--shadow-xl);">
    <!-- SVG Vector Monogram -->
    <div data-aura-logo="icon" data-width="72" data-height="72" style="margin: 0 auto 1.5rem;"></div>

    <h1 style="font-size: 2.25rem; margin-bottom: 0.75rem;">You are currently offline.</h1>
    <p style="color: var(--color-text-muted); margin-bottom: 2rem;">Please check your internet connection to continue real-time tracking and ride booking.</p>

    <button onclick="window.location.reload();" class="btn btn-accent btn-lg">
      🔄 Retry Connection
    </button>
  </div>
  <script src="/static/js/graphics.js"></script>
</body>
</html>
